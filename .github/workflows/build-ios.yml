name: Build iOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version (e.g., v1.0.0)'
        required: false
        type: string

env:
  IOS_VERSION: '26.0'
  XCODE_VERSION: '26.0'
  SCHEME: 'SafeBrowser'
  SIMULATOR: 'iPhone 16 Pro'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build SafeBrowser
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get tag version
        id: get_tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ "$GITHUB_REF" == refs/heads/* ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
            VERSION="${BRANCH}-${GITHUB_SHA::7}"
          else
            VERSION="build-${GITHUB_SHA::7}"
          fi
          # Sanitize: replace any character invalid for artifact names with '-'
          VERSION=$(echo "$VERSION" | tr '/:<>|*?\\"' '-' | tr -d '\r\n')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Build version: $VERSION"

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Verify Xcode
        run: |
          xcodebuild -version
          echo "=== Available Simulator Runtimes ==="
          xcrun simctl list runtimes available || true
          echo "=== Available Simulator Devices ==="
          xcrun simctl list devices available | grep -E "iPhone|iPad" | head -20 || true

      - name: Install XcodeGen
        run: |
          cd ios
          which xcodegen || brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate
          ls -la *.xcodeproj

      - name: Build iOS project (Debug)
        id: build_debug
        run: |
          cd ios
          xcodebuild -project SafeBrowser.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS project (Release)
        id: build_release
        run: |
          cd ios
          xcodebuild -project SafeBrowser.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: List build artifacts
        run: |
          cd ios
          echo "=== Build Artifacts ==="
          if [ -d "./DerivedData/Build/Products" ]; then
            ls -la ./DerivedData/Build/Products/
            find ./DerivedData/Build/Products -name "*.app" -type d
          else
            echo "No DerivedData/Build/Products found"
            find . -name "*.app" -type d 2>/dev/null
          fi

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SafeBrowser-build-${{ steps.get_tag.outputs.VERSION }}
          path: ios/DerivedData/Build/Products/
          retention-days: 14

      - name: Build Summary
        if: success()
        run: |
          echo "## ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.get_tag.outputs.VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Configuration | Debug + Release |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS Target | ${{ env.IOS_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Xcode | ${{ env.XCODE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build artifacts uploaded successfully!" >> $GITHUB_STEP_SUMMARY

  test:
    name: Run Tests
    runs-on: macos-26
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Generate project
        run: |
          cd ios
          which xcodegen || brew install xcodegen
          xcodegen generate

      - name: Pick an available iOS Simulator
        id: pick_sim
        run: |
          # Pick the first available iPhone simulator (any iOS runtime installed on the runner)
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone" | grep -v "unavailable" | head -1 | sed -E 's/^[[:space:]]*([^(]+) \(.*$/\1/' | sed 's/[[:space:]]*$//')
          if [ -z "$DEVICE" ]; then
            echo "No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Selected simulator: $DEVICE"
          echo "DEVICE=$DEVICE" >> $GITHUB_OUTPUT

      - name: Run unit tests
        run: |
          cd ios
          xcodebuild test \
            -project SafeBrowser.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -destination "platform=iOS Simulator,name=${{ steps.pick_sim.outputs.DEVICE }}" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Test Summary
        if: success()
        run: |
          echo "## ✅ All Tests Passed" >> $GITHUB_STEP_SUMMARY
