name: Build iOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version (e.g., v1.0.0)'
        required: false
        type: string

env:
  IOS_VERSION: '26.0'
  XCODE_VERSION: '16.2'
  SCHEME: 'SafeBrowser'
  SIMULATOR: 'iPhone 17 Pro'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build SafeBrowser
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get tag version
        id: get_tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Build version: $VERSION"

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone|iPad" | head -5

      - name: Install XcodeGen
        run: |
          cd ios
          which xcodegen || brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate
          ls -la *.xcodeproj

      - name: Build iOS project (Debug)
        id: build_debug
        run: |
          cd ios
          xcodebuild -project SafeBrowser.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=${{ env.SIMULATOR }}' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS project (Release)
        id: build_release
        run: |
          cd ios
          xcodebuild -project SafeBrowser.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=${{ env.SIMULATOR }}' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: List build artifacts
        run: |
          cd ios
          echo "=== Build Artifacts ==="
          if [ -d "./DerivedData/Build/Products" ]; then
            ls -la ./DerivedData/Build/Products/
            find ./DerivedData/Build/Products -name "*.app" -type d
          else
            echo "No DerivedData/Build/Products found"
            find . -name "*.app" -type d 2>/dev/null
          fi

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SafeBrowser-build-${{ steps.get_tag.outputs.VERSION }}
          path: ios/DerivedData/Build/Products/
          retention-days: 14

      - name: Build Summary
        if: success()
        run: |
          echo "## ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.get_tag.outputs.VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Configuration | Debug + Release |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS Target | ${{ env.IOS_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Xcode | ${{ env.XCODE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build artifacts uploaded successfully!" >> $GITHUB_STEP_SUMMARY
