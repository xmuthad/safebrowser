name: Build iOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version (e.g., v1.0.0)'
        required: false
        type: string

env:
  IOS_VERSION: '26.0'
  XCODE_VERSION: '15.0'
  PROJECT_DIR: 'ios'
  SCHEME: 'SafeBrowser'
  SIMULATOR: 'iPhone 15 Pro'

jobs:
  build:
    name: Build SafeBrowser
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get tag version
        id: get_tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Build version: $VERSION"

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone|iPad" | head -5

      - name: Install XcodeGen
        run: |
          which xcodegen || brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          xcodegen generate
          ls -la *.xcodeproj

      - name: Build iOS project (Debug)
        working-directory: ${{ env.PROJECT_DIR }}
        id: build_debug
        run: |
          xcodebuild -project SafeBrowser.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=${{ env.SIMULATOR }}' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS project (Release)
        working-directory: ${{ env.PROJECT_DIR }}
        id: build_release
        run: |
          xcodebuild -project SafeBrowser.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=${{ env.SIMULATOR }}' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: List build artifacts
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Build Artifacts ==="
          if [ -d "./DerivedData/Build/Products" ]; then
            ls -la ./DerivedData/Build/Products/
            find ./DerivedData/Build/Products -name "*.app" -type d
          else
            echo "No DerivedData/Build/Products found"
            find . -name "*.app" -type d 2>/dev/null
          fi

      - name: Upload build artifacts
        if: success()
        working-directory: ${{ env.PROJECT_DIR }}
        uses: actions/upload-artifact@v4
        with:
          name: SafeBrowser-build-${{ steps.get_tag.outputs.VERSION }}
          path: |
            ./DerivedData/Build/Products/Release-iphonesimulator/*.app
            ./DerivedData/Build/Products/Debug-iphonesimulator/*.app
          retention-days: 14

      - name: Build Summary
        if: success()
        run: |
          echo "## ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.get_tag.outputs.VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Configuration | Debug + Release |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS Target | ${{ env.IOS_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Xcode | ${{ env.XCODE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build artifacts uploaded successfully!" >> $GITHUB_STEP_SUMMARY

  test:
    name: Run Tests
    runs-on: macos-14
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Generate project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          xcodebuild test \
            -project SafeBrowser.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -destination 'platform=iOS Simulator,name=${{ env.SIMULATOR }}' \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Test Summary
        if: success()
        run: |
          echo "## ✅ All Tests Passed" >> $GITHUB_STEP_SUMMARY
