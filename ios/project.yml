name: SafeBrowser
options:
  bundleIdPrefix: com.safechrome
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: SafeBrowser/Resources/Info.plist
    GENERATE_INFOPLIST_FILE: NO

targets:
  SafeBrowser:
    type: application
    platform: iOS
    sources:
      - path: SafeBrowser/Sources
        type: group
      - path: SafeBrowser/Resources
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.safechrome.browser
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: SafeBrowser/Resources/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"

  SafeBrowserTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SafeBrowserTests
        type: group
    dependencies:
      - target: SafeBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.safechrome.browser.tests
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SafeBrowser.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SafeBrowser"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  SafeBrowser:
    build:
      targets:
        SafeBrowser: all
        SafeBrowserTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SafeBrowserTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
